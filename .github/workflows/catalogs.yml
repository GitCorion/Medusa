name: Refresh discovery catalogs

# Refresco MANUAL de los catálogos de descubrimiento (tendencias, popular y plataformas por
# región). No hay cron: los catálogos no están publicados y la app solo los usa si existen.
# Al ejecutarlo, los JSON se versionan en docs/catalogs y pasan a servirse por
# raw.githubusercontent.com. Para que la fila de plataformas los aproveche sin clave TMDB hay
# que ampliar `HomeViewModel.hasDiscoverySource` (ver docs/CATALOGS.md).
# La clave TMDB vive en los secretos del repositorio y nunca viaja en el APK.

on:
  workflow_dispatch:

concurrency:
  group: refresh-discovery-catalogs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Generate & commit catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check TMDB secret
        id: secrets
        run: echo "tmdb=${{ secrets.TMDB_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate catalogs
        if: steps.secrets.outputs.tmdb == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/catalog/generate-catalogs.mjs

      - name: Commit refreshed catalogs
        if: steps.secrets.outputs.tmdb == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/catalogs sigue en .gitignore para evitar commits accidentales de 17 MB;
          # este workflow los añade de forma explícita cuando se decide publicarlos.
          git add -f docs/catalogs
          if git diff --cached --quiet; then
            echo "Catálogos sin cambios"
          else
            git commit -m "chore(catalogs): refrescar catálogos de descubrimiento"
            git push origin HEAD:main
          fi
