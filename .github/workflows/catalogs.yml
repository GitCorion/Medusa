name: Refresh discovery catalogs

# Genera diariamente los catálogos de descubrimiento (tendencias, popular y plataformas por
# región) usando la clave TMDB del repositorio y los versiona en docs/catalogs. La app los
# descarga como JSON estático; la clave nunca viaja en el APK ni se publica.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-discovery-catalogs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Generate & commit catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check TMDB secret
        id: secrets
        run: echo "tmdb=${{ secrets.TMDB_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate catalogs
        if: steps.secrets.outputs.tmdb == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/catalog/generate-catalogs.mjs

      - name: Commit refreshed catalogs
        if: steps.secrets.outputs.tmdb == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogs
          if git diff --cached --quiet; then
            echo "Catálogos sin cambios"
          else
            git commit -m "chore(catalogs): refrescar catálogos de descubrimiento"
            git push origin HEAD:main
          fi
