name: Refresh discovery catalogs

# Genera a diario los catálogos de descubrimiento (plataformas, tendencias y popular regional)
# con la clave TMDB del servidor y los publica en Firebase Hosting. La app solo descarga el
# JSON de su región; la clave nunca viaja en el APK.
#
# Secretos necesarios:
#   TMDB_API_KEY   → clave de TMDB (la misma que usa el build, pero aquí vive en servidor)
#   FIREBASE_TOKEN → token de CI (`firebase login:ci`)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Una sola ejecución a la vez: si llega otro disparo, espera en cola en vez de duplicar.
concurrency:
  group: refresh-discovery-catalogs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Generate & publish catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check secrets
        id: secrets
        run: |
          echo "tmdb=${{ secrets.TMDB_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "deploy=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate catalogs
        if: steps.secrets.outputs.tmdb == 'true' && steps.secrets.outputs.deploy == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/catalog/generate-catalogs.mjs

      - name: Install Firebase CLI
        if: steps.secrets.outputs.tmdb == 'true' && steps.secrets.outputs.deploy == 'true'
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        if: steps.secrets.outputs.tmdb == 'true' && steps.secrets.outputs.deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        if: steps.secrets.outputs.tmdb == 'true' && steps.secrets.outputs.deploy == 'true'
        run: firebase deploy --only hosting:catalogs --project medusa-fd388 --non-interactive
