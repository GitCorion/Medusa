name: Build & Release Medusa APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > app/keystore.jks

      - name: Build Beta APK and Play Store Bundle
        run: ./gradlew assembleBetaRelease bundlePlayRelease --no-daemon
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Opcionales: si no están definidos, se usan los valores por defecto de BuildConfig.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/beta/release/app-beta-release.apk dist/Medusa.apk
          cp app/build/outputs/apk/beta/release/app-beta-release.apk dist/Tujelly.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/Medusa-PlayStore.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-Builds
          path: |
            dist/Medusa.apk
            dist/Tujelly.apk
            dist/Medusa-PlayStore.aab

      - name: Create GitHub Release (on tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Medusa.apk
            dist/Tujelly.apk
            dist/Medusa-PlayStore.aab
          name: Medusa ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
