name: Build & Publish Medusa (Firebase OTA)

# El repositorio es privado: sus Releases no sirven para actualizar a los usuarios.
# La distribución pública (OTA de la beta) se hace por Firebase Hosting.
#
# Disparadores:
#   - push de un tag `v*`  → compila, publica el OTA beta y sube el AAB a Play Internal.
#   - manual (workflow_dispatch) → compila; publica si `deploy` está marcado.
#
# Secretos necesarios: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#                      (opc.) TMDB_API_KEY, TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET,
#                      FIREBASE_TOKEN (generado con `firebase login:ci`),
#                      PLAY_SERVICE_ACCOUNT_JSON (service account con acceso a Play;
#                      si falta, el paso de subida a Play se omite y el resto sigue).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar en Firebase Hosting (OTA)"
        type: boolean
        default: true
      release_notes:
        description: "Notas de la versión (opcional)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > app/keystore.jks

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon

      - name: Build Beta APK and Play bundle
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Opcionales: si no están definidos, se usan los valores por defecto de BuildConfig.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: ./gradlew :app:assembleBetaRelease :app:bundlePlayRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-Builds
          path: |
            app/build/outputs/apk/beta/release/app-beta-release.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab

      # ¿Hay credenciales de Play configuradas? Si no, el resto del workflow sigue igual.
      - name: Check Play credentials
        id: play
        run: echo "enabled=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Play (Internal testing)
        if: steps.play.outputs.enabled == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: tv.medusa.app
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          track: internal
          status: completed

      # ¿Hay credenciales de Firebase configuradas? Si no, se omite el deploy OTA sin romper el build.
      - name: Check Firebase credentials
        id: firebase
        run: echo "enabled=${{ secrets.FIREBASE_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Warn if Firebase token is missing
        if: steps.firebase.outputs.enabled != 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: echo "::warning::El secreto FIREBASE_TOKEN no está configurado en GitHub Secrets. Se omite la publicación OTA en Firebase Hosting."

      - name: Set up Node (Firebase CLI)
        if: steps.firebase.outputs.enabled == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        if: steps.firebase.outputs.enabled == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        run: npm install -g firebase-tools

      - name: Publish OTA to Firebase Hosting
        if: steps.firebase.outputs.enabled == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Vacío → se conservan las notas ya presentes en docs/api/version.json.
          OTA_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: SKIP_BUILD=1 ./scripts/publish-ota.sh
