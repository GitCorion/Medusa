name: Build & Publish (GitHub Releases)

# Distribución pública: el APK se publica como asset de un GitHub Release y el manifiesto
# que lee la app (docs/api/version.json) se versiona en main. Sin Firebase ni Play Store.
#
# Disparadores:
#   - push de un tag v* → compila, crea el Release y publica el manifiesto.
#   - manual → compila; publica solo si `publish` está marcado.
#
# Secretos: KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#           (opc.) TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar Release y manifiesto OTA"
        type: boolean
        default: true
      release_notes:
        description: "Notas de la versión (opcionales)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > app/keystore.jks

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Medusa-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Generate release manifest
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Medusa.apk
          OTA_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: SKIP_BUILD=1 ./scripts/publish-ota.sh

      # action-gh-release no renombra con "origen:destino": copiamos el APK con el
      # nombre final que espera el manifiesto OTA (Medusa.apk).
      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Medusa.apk"

      - name: Create GitHub Release with APK asset
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Medusa ${{ github.ref_name }}
          body: ${{ inputs.release_notes || 'Publicado desde GitHub Actions. Cambios en docs/api/version.json.' }}
          files: ${{ runner.temp }}/Medusa.apk
          fail_on_unmatched_files: true

      - name: Publish manifest to main (OTA + GitHub Pages)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp docs/api/version.json "$RUNNER_TEMP/version.json"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/version.json" docs/api/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/version.json
          if git diff --cached --quiet; then
            echo "version.json sin cambios"
          else
            git commit -m "chore(ota): publicar manifiesto para $RELEASE_TAG"
            git push origin main
          fi
